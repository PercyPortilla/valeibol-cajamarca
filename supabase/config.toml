project_id = "valeibol-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
enable_signup = false
site_url = "https://valeibol-cajamarca-live.vercel.app"
additional_redirect_urls = [
  "https://valeibol-cajamarca-live.vercel.app/**",
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]

[auth.email]
enable_signup = false
secure_password_change = true

[functions.public-reservation-request]
verify_jwt = false

[functions.admin-access-management]
verify_jwt = true

[functions.platform-business-onboarding]
verify_jwt = true

[functions.platform-owner-recovery]
verify_jwt = true
