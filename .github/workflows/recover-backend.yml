name: Recover Valeibol backend

on:
  push:
    branches: [work/backend-recovery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Phase 3-7 backend, tests and docs
        shell: bash
        run: |
          set -euo pipefail

          if [ -f supabase/migrations/202610140005_phase7_customers_pricing_metrics.sql ] && [ -f tests/phase7.test.ts ]; then
            echo "Recovery already completed."
            exit 0
          fi

          for part in .recovery/part-{00..07} .recovery/part-08a .recovery/part-08b .recovery/part-08c .recovery/part-09; do
            test -f "$part" || { echo "Missing $part" >&2; exit 1; }
          done

          cat .recovery/part-{00..09} | tr -d '\r\n' | base64 -d > /tmp/valeibol-missing.tar.gz
          tar -tzf /tmp/valeibol-missing.tar.gz >/dev/null
          tar -xzf /tmp/valeibol-missing.tar.gz -C .

          test -f supabase/migrations/202610140001_phase3_core.sql
          test -f supabase/migrations/202610140002_phase4_public_booking.sql
          test -f supabase/migrations/202610140003_phase5_admin_auth.sql
          test -f supabase/migrations/202610140004_phase6_admin_operations.sql
          test -f supabase/migrations/202610140005_phase7_customers_pricing_metrics.sql
          test -f supabase/seed.sql
          test -f supabase/tests/phase7.sql
          test -f tests/availability.test.ts
          test -f tests/booking.test.ts
          test -f tests/admin-auth.test.ts
          test -f tests/admin-operations.test.ts
          test -f tests/phase7.test.ts
          test -f scripts/validate-phase7.mjs
          test -f scripts/integration-phase6-concurrency.mjs

          rm -rf .recovery
          rm -f .github/workflows/recover-backend.yml
          rm -f bootstrap.mjs patch-build.mjs scripts/bootstrap.sh

          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run qa
          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: restore full Phase 3-7 backend and tests"
          git push origin HEAD:work/backend-recovery
