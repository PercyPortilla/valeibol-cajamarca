name: Restore Valeibol source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and validate source tree once
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/page.tsx ] && [ -f lib/availability.ts ]; then
            echo "Valeibol source is already restored."
            exit 0
          fi

          test -d .bootstrap
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06 .bootstrap/part-07 .bootstrap/part-08 \
            | tr -d '\r\n' \
            | base64 -d > /tmp/valeibol.tar.gz
          tar -xzf /tmp/valeibol.tar.gz -C .

          node patch-build.mjs

          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: restore validated Valeibol Phase 7 source"
          git push origin HEAD:main
