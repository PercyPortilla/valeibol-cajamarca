name: Bootstrap Valeibol source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source tree when needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "Source tree already restored; nothing to do."
            exit 0
          fi
          test -d .bootstrap
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 .bootstrap/part-05 .bootstrap/part-06 .bootstrap/part-07 .bootstrap/part-08 > /tmp/valeibol.tar.gz.b64
          base64 -d /tmp/valeibol.tar.gz.b64 > /tmp/valeibol.tar.gz
          tar -xzf /tmp/valeibol.tar.gz -C .
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: restore Valeibol Phase 7 source"
          git push origin HEAD:main
