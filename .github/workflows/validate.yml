name: Validate Valeibol

on:
  push:
    branches: [main, "work/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify repository completeness
        run: node scripts/validate-repository.mjs

      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and model tests
        run: npm test

      - name: Phase QA
        run: npm run qa

      - name: Production build
        run: npm run build

  supabase-sql-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild local Supabase and run SQL contracts
        run: npm run supabase:e2e:local
